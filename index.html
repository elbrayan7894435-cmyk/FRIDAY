<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRIDAY</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at center, #102438 0%, #050b12 45%, #020509 100%);
            color: #dff8ff;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }

        .container {
            min-height: 100vh;
            padding: 35px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .top {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 50px;
        }

        .logo {
            font-size: 26px;
            letter-spacing: 9px;
            font-weight: 300;
        }

        .status {
            font-size: 12px;
            letter-spacing: 2px;
            color: #65f6c4;
        }

        .status::before {
            content: "●";
            margin-right: 8px;
        }

        .core {
            width: 230px;
            height: 230px;
            border-radius: 50%;
            border: 1px solid rgba(120, 220, 255, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow:
                0 0 25px rgba(80, 210, 255, 0.35),
                inset 0 0 30px rgba(80, 210, 255, 0.12);
            animation: pulse 3s infinite;
        }

        .core::before,
        .core::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(120, 220, 255, 0.35);
        }

        .core::before {
            width: 175px;
            height: 175px;
        }

        .core::after {
            width: 115px;
            height: 115px;
        }

        .inner {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #bdf5ff;
            box-shadow:
                0 0 20px #73ddff,
                0 0 50px #39bfff;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.035);
            }
        }

        .greeting {
            margin-top: 45px;
            text-align: center;
        }

        .greeting h1 {
            font-size: 32px;
            font-weight: 300;
            margin: 0 0 12px;
            letter-spacing: 4px;
        }

        .greeting p {
            margin: 0;
            color: #7695a3;
            letter-spacing: 1px;
        }

        .panels {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 55px;
        }

        .panel {
            padding: 20px;
            border: 1px solid rgba(120, 220, 255, 0.15);
            background: rgba(8, 20, 30, 0.65);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .panel-title {
            font-size: 11px;
            color: #7193a3;
            letter-spacing: 2px;
        }

        .panel-value {
            margin-top: 10px;
            font-size: 24px;
        }

        /* CHAT */

        .chat-window {
            width: 100%;
            max-width: 900px;
            height: 350px;
            margin-top: 30px;
            padding: 20px;
            overflow-y: auto;

            border: 1px solid rgba(120, 220, 255, 0.15);
            border-radius: 14px;

            background: rgba(5, 15, 23, 0.65);
            backdrop-filter: blur(12px);

            box-shadow:
                inset 0 0 30px rgba(80, 210, 255, 0.04);
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            margin-bottom: 12px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 14px;
        }

        .friday-message {
            background: rgba(120, 220, 255, 0.08);
            border: 1px solid rgba(120, 220, 255, 0.12);
            margin-right: auto;
        }

        .user-message {
            background: rgba(101, 246, 196, 0.08);
            border: 1px solid rgba(101, 246, 196, 0.12);
            margin-left: auto;
        }

        .message-name {
            font-size: 10px;
            letter-spacing: 2px;
            color: #7193a3;
            margin-bottom: 5px;
        }

        .chat {
            width: 100%;
            max-width: 900px;
            margin-top: 12px;
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 17px;
            border-radius: 10px;
            border: 1px solid rgba(120, 220, 255, 0.2);
            background: rgba(5, 15, 23, 0.8);
            color: white;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: rgba(120, 220, 255, 0.55);
            box-shadow: 0 0 15px rgba(80, 210, 255, 0.08);
        }

        button {
            padding: 17px 22px;
            border: 0;
            border-radius: 10px;
            background: #bdf5ff;
            color: #041018;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            box-shadow: 0 0 20px rgba(120, 220, 255, 0.35);
        }

        @media (max-width: 650px) {

            .panels {
                grid-template-columns: 1fr;
            }

            .top {
                margin-bottom: 35px;
            }

            .logo {
                font-size: 20px;
            }

            .core {
                width: 190px;
                height: 190px;
            }

            .chat-window {
                height: 300px;
            }

            .message {
                max-width: 88%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="top">
        <div class="logo">FRIDAY</div>
        <div class="status">SYSTEM ONLINE</div>
    </div>

    <div class="core">
        <div class="inner"></div>
    </div>

    <div class="greeting">
        <h1>GOOD EVENING</h1>
        <p>Your personal AI assistant</p>
    </div>

    <div class="panels">

        <div class="panel">
            <div class="panel-title">CALENDAR</div>
            <div class="panel-value">--</div>
        </div>

        <div class="panel">
            <div class="panel-title">MEMORY</div>
            <div class="panel-value">READY</div>
        </div>

        <div class="panel">
            <div class="panel-title">SYSTEM</div>
            <div class="panel-value">ONLINE</div>
        </div>

    </div>

    <div class="chat-window" id="chatWindow">

        <div class="message friday-message">
            <div class="message-name">FRIDAY</div>
            System initialized. How can I assist you?
        </div>

    </div>

    <div class="chat">

        <input
            id="messageInput"
            type="text"
            placeholder="Talk to FRIDAY..."
            autocomplete="off"
        >

        <button id="sendButton">ENTER</button>

    </div>

</div>

<script>

const input = document.getElementById("messageInput");
const button = document.getElementById("sendButton");
const chatWindow = document.getElementById("chatWindow");

function addMessage(text, type) {

    const message = document.createElement("div");

    message.classList.add("message");

    if (type === "user") {
        message.classList.add("user-message");
    } else {
        message.classList.add("friday-message");
    }

    const name = document.createElement("div");

    name.classList.add("message-name");

    name.textContent = type === "user" ? "YOU" : "FRIDAY";

    const content = document.createElement("div");

    content.textContent = text;

    message.appendChild(name);
    message.appendChild(content);

    chatWindow.appendChild(message);

    chatWindow.scrollTop = chatWindow.scrollHeight;
}

    function getUserId() {
    let userId = localStorage.getItem("friday_user_id");

    if (!userId) {
        userId = crypto.randomUUID();
        localStorage.setItem("friday_user_id", userId);
    }

    return userId;
}

const userId = getUserId();
    
async function sendMessage() {

    const text = input.value.trim();

    if (text === "") return;

    addMessage(text, "user");

    input.value = "";

    try {

const response = await fetch(
    "https://friday-ai.elbrayan7894435.workers.dev",
    {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            message: text,
            userId: userId
        })
    }
);

        const data = await response.json();

        addMessage(data.message, "friday");

    } catch (error) {

        addMessage(
            "Connection error. My backend is not responding.",
            "friday"
        );

        console.error(error);
    }
}

button.addEventListener("click", sendMessage);

input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

});

</script>

</body>
</html>
