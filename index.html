<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRIDAY | Personal AI Assistant</title>

    <style>
        :root {
            --bg-glow: radial-gradient(circle at center, #102438 0%, #050b12 45%, #020509 100%);
            --primary-cyan: #dff8ff;
            --accent-cyan: #78dceb;
            --core-glow: #39bfff;
            --status-green: #65f6c4;
            --status-red: #ff5555;
            --panel-bg: rgba(8, 20, 30, 0.65);
            --border-glow: rgba(120, 220, 255, 0.15);
            --font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: var(--bg-glow);
            color: var(--primary-cyan);
            font-family: var(--font-family);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            min-height: 100vh;
            padding: 35px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* TOP HEADER */
        .top {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 26px;
            letter-spacing: 9px;
            font-weight: 300;
            text-shadow: 0 0 10px rgba(120, 220, 255, 0.3);
        }

        .status {
            font-size: 12px;
            letter-spacing: 2px;
            color: var(--status-green);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.3s ease;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--status-green);
            box-shadow: 0 0 8px var(--status-green);
        }

        .status.offline {
            color: var(--status-red);
        }

        .status.offline .status-dot {
            background-color: var(--status-red);
            box-shadow: 0 0 8px var(--status-red);
        }

        /* ARC REACTOR CORE */
        .core-wrapper {
            position: relative;
            margin: 10px 0;
        }

        .core {
            width: 210px;
            height: 210px;
            border-radius: 50%;
            border: 1px solid rgba(120, 220, 255, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow:
                0 0 25px rgba(80, 210, 255, 0.35),
                inset 0 0 30px rgba(80, 210, 255, 0.12);
            animation: pulse 3s infinite ease-in-out;
            transition: all 0.5s ease;
        }

        .core::before,
        .core::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            border: 1px dashed rgba(120, 220, 255, 0.35);
        }

        .core::before {
            width: 160px;
            height: 160px;
            animation: spin 20s linear infinite;
        }

        .core::after {
            width: 110px;
            height: 110px;
            animation: spin-reverse 15s linear infinite;
        }

        .inner {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #bdf5ff;
            box-shadow:
                0 0 20px #73ddff,
                0 0 50px var(--core-glow);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* CORE STATES */
        .core.thinking {
            animation: pulse-fast 1s infinite ease-in-out;
            border-color: #65f6c4;
            box-shadow: 0 0 40px rgba(101, 246, 196, 0.5);
        }

        .core.thinking .inner {
            background: #65f6c4;
            box-shadow: 0 0 30px #65f6c4, 0 0 60px #65f6c4;
        }

        .core.listening {
            border-color: #ffb86c;
            box-shadow: 0 0 40px rgba(255, 184, 108, 0.5);
        }

        .core.listening .inner {
            background: #ffb86c;
            box-shadow: 0 0 30px #ffb86c, 0 0 60px #ffb86c;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.035); }
        }

        @keyframes pulse-fast {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes spin-reverse {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }

        /* GREETING */
        .greeting {
            margin-top: 35px;
            text-align: center;
        }

        .greeting h1 {
            font-size: 30px;
            font-weight: 300;
            margin: 0 0 8px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .greeting p {
            margin: 0;
            color: #7695a3;
            letter-spacing: 1.5px;
            font-size: 14px;
        }

        /* PANELS */
        .panels {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 40px;
        }

        .panel {
            padding: 16px 20px;
            border: 1px solid var(--border-glow);
            background: var(--panel-bg);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            transition: border-color 0.3s ease;
        }

        .panel:hover {
            border-color: rgba(120, 220, 255, 0.4);
        }

        .panel-title {
            font-size: 10px;
            color: #7193a3;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .panel-value {
            margin-top: 8px;
            font-size: 18px;
            font-weight: 400;
            letter-spacing: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* CHAT WINDOW */
        .chat-window {
            width: 100%;
            height: 320px;
            margin-top: 25px;
            padding: 20px;
            overflow-y: auto;
            border: 1px solid var(--border-glow);
            border-radius: 14px;
            background: rgba(5, 15, 23, 0.65);
            backdrop-filter: blur(12px);
            box-shadow: inset 0 0 30px rgba(80, 210, 255, 0.04);
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        .chat-window::-webkit-scrollbar {
            width: 5px;
        }

        .chat-window::-webkit-scrollbar-thumb {
            background: rgba(120, 220, 255, 0.2);
            border-radius: 10px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 14px;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }

        .message-content {
            white-space: pre-wrap;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .friday-message {
            background: rgba(120, 220, 255, 0.08);
            border: 1px solid rgba(120, 220, 255, 0.12);
            margin-right: auto;
            border-top-left-radius: 2px;
        }

        .user-message {
            background: rgba(101, 246, 196, 0.08);
            border: 1px solid rgba(101, 246, 196, 0.12);
            margin-left: auto;
            border-top-right-radius: 2px;
        }

        .message-name {
            font-size: 10px;
            letter-spacing: 2px;
            color: #7193a3;
            margin-bottom: 6px;
            font-weight: bold;
        }

        /* INPUT BAR */
        .chat-input-container {
            width: 100%;
            margin-top: 12px;
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 16px 20px;
            border-radius: 10px;
            border: 1px solid rgba(120, 220, 255, 0.2);
            background: rgba(5, 15, 23, 0.85);
            color: white;
            outline: none;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: rgba(120, 220, 255, 0.55);
            box-shadow: 0 0 15px rgba(80, 210, 255, 0.12);
        }

        .btn {
            padding: 0 22px;
            border: 0;
            border-radius: 10px;
            background: #bdf5ff;
            color: #041018;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            box-shadow: 0 0 20px rgba(120, 220, 255, 0.4);
            transform: translateY(-1px);
        }

        .btn:focus-visible {
            outline: 2px solid var(--accent-cyan);
            outline-offset: 2px;
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-mic {
            background: rgba(120, 220, 255, 0.15);
            color: var(--primary-cyan);
            border: 1px solid rgba(120, 220, 255, 0.2);
            padding: 0 16px;
        }

        .btn-mic.listening {
            background: rgba(255, 184, 108, 0.2);
            border-color: #ffb86c;
            color: #ffb86c;
        }

        /* TYPING DOTS */
        .typing-indicator {
            display: inline-flex;
            gap: 4px;
            align-items: center;
        }

        .typing-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--accent-cyan);
            animation: blink 1.4s infinite both;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0.2; }
            40% { opacity: 1; }
        }

        /* RESPONSIVE */
        @media (max-width: 650px) {
            .container {
                padding: 20px 15px;
            }
            .panels {
                grid-template-columns: 1fr;
            }
            .core {
                width: 170px;
                height: 170px;
            }
            .core::before { width: 130px; height: 130px; }
            .core::after { width: 90px; height: 90px; }
            .chat-window {
                height: 280px;
            }
            .message {
                max-width: 90%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- HEADER TOP -->
    <header class="top">
        <div class="logo">FRIDAY</div>
        <div class="status" id="systemStatus" aria-live="polite">
            <span class="status-dot"></span>
            <span id="statusText">SYSTEM ONLINE</span>
        </div>
    </header>

    <!-- CORE VISUAL -->
    <div class="core-wrapper" aria-hidden="true">
        <div class="core" id="coreReactor">
            <div class="inner"></div>
        </div>
    </div>

    <!-- GREETING -->
    <main style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <div class="greeting">
            <h1 id="greetingHeading">GOOD EVENING</h1>
            <p>Your personal AI assistant</p>
        </div>

        <!-- HUD PANELS -->
        <div class="panels">
            <div class="panel">
                <div class="panel-title">CALENDAR</div>
                <div class="panel-value" id="panelCalendar">--</div>
            </div>

            <div class="panel">
                <div class="panel-title">MEMORY</div>
                <div class="panel-value" id="panelMemory">ACTIVE</div>
            </div>

            <div class="panel">
                <div class="panel-title">SYSTEM</div>
                <div class="panel-value" id="panelSystem">ONLINE</div>
            </div>
        </div>

        <!-- CHAT WINDOW -->
        <div class="chat-window" id="chatWindow" role="log" aria-live="polite" aria-label="Conversation log">
            <div class="message friday-message">
                <div class="message-name">FRIDAY</div>
                <div class="message-content">System initialized. How can I assist you?</div>
            </div>
        </div>

        <!-- INPUT CONTROLS -->
        <div class="chat-input-container">
            <button class="btn btn-mic" id="micButton" title="Toggle microphone (Alt + M)" aria-label="Toggle microphone">
                🎤
            </button>

            <input
                id="messageInput"
                type="text"
                placeholder="Talk to FRIDAY..."
                autocomplete="off"
                spellcheck="false"
                aria-label="Message FRIDAY"
            >

            <button class="btn" id="sendButton" aria-label="Send message">ENTER</button>
        </div>
    </main>

</div>

<script>
    // CONFIGURATION AND REFERENCES
    // Supports dynamic override via localStorage for local testing or custom deployment
    const DEFAULT_WORKER_URL = "https://friday-ai.elbrayan7894435.workers.dev";
    const WORKER_URL = localStorage.getItem("friday_worker_url") || DEFAULT_WORKER_URL;
    const REQUEST_TIMEOUT_MS = 15000; // 15-second timeout safeguard
    
    const input = document.getElementById("messageInput");
    const button = document.getElementById("sendButton");
    const micButton = document.getElementById("micButton");
    const chatWindow = document.getElementById("chatWindow");
    const coreReactor = document.getElementById("coreReactor");
    
    // HUD PANELS
    const panelCalendar = document.getElementById("panelCalendar");
    const panelMemory = document.getElementById("panelMemory");
    const panelSystem = document.getElementById("panelSystem");
    const greetingHeading = document.getElementById("greetingHeading");
    const systemStatus = document.getElementById("systemStatus");
    const statusText = document.getElementById("statusText");

    // 1. SAFE USER ID MANAGEMENT
    function getUserId() {
        let userId = localStorage.getItem("friday_user_id");
        if (!userId) {
            userId = (typeof crypto !== "undefined" && crypto.randomUUID) 
                ? crypto.randomUUID() 
                : "user_" + Math.random().toString(36).substring(2, 11);
            localStorage.setItem("friday_user_id", userId);
        }
        return userId;
    }

    const userId = getUserId();

    // 2. DYNAMIC HUD & CLOCK UPDATE
    function updateHUD(memoryStatusOverride) {
        const now = new Date();
        
        // Dynamic greeting based on hour
        const hours = now.getHours();
        if (hours < 12) greetingHeading.textContent = "GOOD MORNING";
        else if (hours < 18) greetingHeading.textContent = "GOOD AFTERNOON";
        else greetingHeading.textContent = "GOOD EVENING";

        // Date format
        const options = { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false };
        panelCalendar.textContent = now.toLocaleDateString('en-US', options).toUpperCase();

        // Network status
        if (navigator.onLine) {
            panelSystem.textContent = "ONLINE";
            statusText.textContent = "SYSTEM ONLINE";
            systemStatus.classList.remove("offline");
        } else {
            panelSystem.textContent = "OFFLINE";
            statusText.textContent = "DISCONNECTED";
            systemStatus.classList.add("offline");
        }

        if (memoryStatusOverride) {
            panelMemory.textContent = memoryStatusOverride;
        } else {
            panelMemory.textContent = userId ? "CONNECTED" : "READY";
        }
    }

    setInterval(() => updateHUD(), 1000);
    updateHUD();

    // 3. UI MESSAGE MANAGEMENT
    function addMessage(text, type) {
        const message = document.createElement("div");
        message.classList.add("message");
        message.classList.add(type === "user" ? "user-message" : "friday-message");

        const name = document.createElement("div");
        name.classList.add("message-name");
        name.textContent = type === "user" ? "YOU" : "FRIDAY";

        const content = document.createElement("div");
        content.classList.add("message-content");
        content.textContent = text;

        message.appendChild(name);
        message.appendChild(content);

        chatWindow.appendChild(message);
        chatWindow.scrollTop = chatWindow.scrollHeight;
        return message;
    }

    // TYPING INDICATOR
    function showTypingIndicator() {
        const message = document.createElement("div");
        message.classList.add("message", "friday-message");
        message.id = "typingIndicator";

        const name = document.createElement("div");
        name.classList.add("message-name");
        name.textContent = "FRIDAY";

        const indicator = document.createElement("div");
        indicator.classList.add("typing-indicator");
        indicator.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';

        message.appendChild(name);
        message.appendChild(indicator);
        chatWindow.appendChild(message);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function removeTypingIndicator() {
        const indicator = document.getElementById("typingIndicator");
        if (indicator) indicator.remove();
    }

    // 4. VOICE SYNTHESIS (SPEECH OUTPUT)
    let availableVoices = [];
    function loadVoices() {
        if ('speechSynthesis' in window) {
            availableVoices = window.speechSynthesis.getVoices();
        }
    }
    if ('speechSynthesis' in window) {
        loadVoices();
        window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    function speak(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); // Clear previous queue
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = navigator.language || 'en-US';
            utterance.rate = 1.0;
            utterance.pitch = 1.0;

            if (availableVoices.length > 0) {
                // Prefer matching locale voices
                const targetLang = (navigator.language || 'en-US').substring(0, 2);
                const matchingVoice = availableVoices.find(v => v.lang.startsWith(targetLang));
                if (matchingVoice) utterance.voice = matchingVoice;
            }

            window.speechSynthesis.speak(utterance);
        }
    }

    // 5. SEND MESSAGE TO WORKER WITH TIMEOUT & ROBUST ERROR HANDLING
    async function sendMessage() {
        const text = input.value.trim();
        if (text === "") return;

        if (!navigator.onLine) {
            addMessage(text, "user");
            addMessage("Offline mode active. Connection to backend server is unavailable.", "friday");
            input.value = "";
            return;
        }

        // Temporarily disable input controls
        input.value = "";
        input.disabled = true;
        button.disabled = true;

        addMessage(text, "user");
        showTypingIndicator();

        // Update reactor animation
        coreReactor.classList.add("thinking");

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);

        try {
            const response = await fetch(WORKER_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: text,
                    userId: userId
                }),
                signal: controller.signal
            });

            clearTimeout(timeoutId);
            removeTypingIndicator();

            if (!response.ok) {
                if (response.status === 429) {
                    throw new Error("Rate limit exceeded. Please wait a moment before sending another message.");
                } else if (response.status >= 500) {
                    throw new Error(`Server error (${response.status}). My backend service is currently experiencing issues.`);
                } else {
                    throw new Error(`Unexpected status code: ${response.status}`);
                }
            }

            let data;
            try {
                data = await response.json();
            } catch (jsonErr) {
                throw new Error("Invalid response format received from backend server.");
            }

            const reply = data.response || "I received an empty response.";

            // Handle metadata if backend provided memory/knowledge context indicators
            if (data.memoryUsed) {
                updateHUD("KV MEMORY");
            } else if (data.knowledgeUsed) {
                updateHUD("AI SEARCH");
            }

            addMessage(reply, "friday");
            speak(reply);

        } catch (error) {
            clearTimeout(timeoutId);
            console.error("Communication error:", error);
            removeTypingIndicator();

            let errorMessage = "Connection error. My backend is not responding.";
            if (error.name === "AbortError") {
                errorMessage = "Request timed out. My backend took too long to respond.";
            } else if (error.message) {
                errorMessage = error.message;
            }

            addMessage(errorMessage, "friday");
        } finally {
            // Restore control state
            coreReactor.classList.remove("thinking");
            input.disabled = false;
            button.disabled = false;
            input.focus();
        }
    }

    // 6. SPEECH RECOGNITION (MICROPHONE INPUT)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = navigator.language || 'en-US';
        recognition.continuous = false;

        recognition.onstart = () => {
            micButton.classList.add("listening");
            coreReactor.classList.add("listening");
            input.placeholder = "Listening...";
        };

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            input.value = transcript;
            sendMessage();
        };

        recognition.onerror = (event) => {
            console.error("Speech Recognition error:", event.error);
            stopListening();
        };

        recognition.onend = () => {
            stopListening();
        };
    } else {
        micButton.style.display = "none"; // Hide if unsupported by browser
    }

    function stopListening() {
        micButton.classList.remove("listening");
        coreReactor.classList.remove("listening");
        input.placeholder = "Talk to FRIDAY...";
    }

    micButton.addEventListener("click", () => {
        if (!recognition) return;
        try {
            recognition.start();
        } catch (e) {
            recognition.stop();
        }
    });

    // EVENT LISTENERS
    button.addEventListener("click", sendMessage);

    input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
            sendMessage();
        }
    });

    // Shortcut Alt + M to toggle microphone
    document.addEventListener("keydown", (e) => {
        if (e.altKey && e.key.toLowerCase() === 'm') {
            micButton.click();
        }
    });

    // Detect network status changes
    window.addEventListener('online', updateHUD);
    window.addEventListener('offline', updateHUD);
</script>

</body>
</html>
