<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRIDAY</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at center, #102438 0%, #050b12 45%, #020509 100%);
            color: #dff8ff;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }

        .container {
            min-height: 100vh;
            padding: 35px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .top {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 50px;
        }

        .logo {
            font-size: 26px;
            letter-spacing: 9px;
            font-weight: 300;
        }

        .status {
            font-size: 12px;
            letter-spacing: 2px;
            color: #65f6c4;
        }

        .status::before {
            content: "●";
            margin-right: 8px;
        }

        .core {
            width: 230px;
            height: 230px;
            border-radius: 50%;
            border: 1px solid rgba(120, 220, 255, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow:
                0 0 25px rgba(80, 210, 255, 0.35),
                inset 0 0 30px rgba(80, 210, 255, 0.12);
            animation: pulse 3s infinite;
        }

        .core::before,
        .core::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(120, 220, 255, 0.35);
        }

        .core::before {
            width: 175px;
            height: 175px;
        }

        .core::after {
            width: 115px;
            height: 115px;
        }

        .inner {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #bdf5ff;
            box-shadow:
                0 0 20px #73ddff,
                0 0 50px #39bfff;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.035);
            }
        }

        .greeting {
            margin-top: 45px;
            text-align: center;
        }

        .greeting h1 {
            font-size: 32px;
            font-weight: 300;
            margin: 0 0 12px;
            letter-spacing: 4px;
        }

        .greeting p {
            margin: 0;
            color: #7695a3;
            letter-spacing: 1px;
        }

        .panels {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 55px;
        }

        .panel {
            padding: 20px;
            border: 1px solid rgba(120, 220, 255, 0.15);
            background: rgba(8, 20, 30, 0.65);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .panel-title {
            font-size: 11px;
            color: #7193a3;
            letter-spacing: 2px;
        }

        .panel-value {
            margin-top: 10px;
            font-size: 24px;
        }

        .chat {
            width: 100%;
            max-width: 900px;
            margin-top: 30px;
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 17px;
            border-radius: 10px;
            border: 1px solid rgba(120, 220, 255, 0.2);
            background: rgba(5, 15, 23, 0.8);
            color: white;
            outline: none;
        }

        button {
            padding: 17px 22px;
            border: 0;
            border-radius: 10px;
            background: #bdf5ff;
            color: #041018;
            font-weight: bold;
            cursor: pointer;
        }

        @media (max-width: 650px) {
            .panels {
                grid-template-columns: 1fr;
            }

            .top {
                margin-bottom: 35px;
            }

            .logo {
                font-size: 20px;
            }

            .core {
                width: 190px;
                height: 190px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="top">
        <div class="logo">FRIDAY</div>
        <div class="status">SYSTEM ONLINE</div>
    </div>

    <div class="core">
        <div class="inner"></div>
    </div>

    <div class="greeting">
        <h1>GOOD EVENING</h1>
        <p>Your personal AI assistant</p>
    </div>

    <div class="panels">

        <div class="panel">
            <div class="panel-title">CALENDAR</div>
            <div class="panel-value">--</div>
        </div>

        <div class="panel">
            <div class="panel-title">MEMORY</div>
            <div class="panel-value">READY</div>
        </div>

        <div class="panel">
            <div class="panel-title">SYSTEM</div>
            <div class="panel-value">ONLINE</div>
        </div>

    </div>

    <div class="chat">
        <input
            type="text"
            placeholder="Talk to FRIDAY..."
        >

        <button>ENTER</button>
    </div>

</div>
    
<script>
const input = document.querySelector("input");
const button = document.querySelector("button");

button.addEventListener("click", function() {
    const message = input.value.trim();

    if (message === "") return;

    alert("FRIDAY: Recibido. Estoy lista para ayudarte.");

    input.value = "";
});

input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        button.click();
    }
});
</script>
</body>
</html>
